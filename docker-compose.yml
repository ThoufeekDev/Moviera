services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/
        VITE_TURNSTILE_SITE_KEY: 0x4AAAAAADSWXkkakHCXcVw_
        VITE_GOOGLE_CLIENT_ID: 785821872180-nrq7skchr675b18fjo5on80o4v6p76le.apps.googleusercontent.com
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
    container_name: moviera-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    container_name: moviera-redis